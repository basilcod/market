<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>سوبر ماركت إكسبرس</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

  <style>
    :root{
      --primary:#27ae60;
      --secondary:#2c3e50;
      --bg:#f5f6fa;
      --surface:#ffffff;
      --danger:#e74c3c;
      --ok:#2ecc71;
      --text:#2c3e50;
      --muted:#7b8794;
      --shadow:0 4px 10px rgba(0,0,0,.06);
      --radius:16px;
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body{ font-family:'Cairo',sans-serif; background:var(--bg); color:var(--text); margin:0; padding-bottom:90px; }
    input,button,select,textarea{ font-family:'Cairo',sans-serif; font-size:16px !important; }
    a{ color:inherit; text-decoration:none; }

    /* Header */
    header{
      background:var(--primary);
      color:#fff;
      padding:14px 14px;
      position:sticky; top:0; z-index:200;
      box-shadow:0 6px 18px rgba(39,174,96,.22);
    }
    .header-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .header-title{
      display:flex; align-items:center; gap:10px;
      font-weight:800; font-size:1.1rem;
      white-space:nowrap;
    }
    .header-actions{
      display:flex; align-items:center; gap:10px;
    }
    .icon-btn{
      width:42px; height:42px;
      border:none; border-radius:12px;
      background:rgba(255,255,255,.15);
      color:#fff;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer;
      position:relative;
    }
    .icon-btn:active{ transform:scale(.98); }
    .badge{
      position:absolute; top:-6px; left:-6px;
      background:var(--danger);
      color:#fff;
      width:22px; height:22px;
      border-radius:999px;
      display:flex; align-items:center; justify-content:center;
      font-size:.75rem; font-weight:800;
      border:2px solid var(--primary);
    }

    /* Search */
    .search-wrapper{
      background:var(--primary);
      padding:0 14px 14px 14px;
    }
    .search-input{
      width:100%;
      padding:12px 18px;
      border:none;
      border-radius:999px;
      outline:none;
      background:#ffffff;
      box-shadow:0 8px 18px rgba(0,0,0,.08);
    }
    .search-hint{
      color:rgba(255,255,255,.85);
      margin:8px 4px 0 0;
      font-size:.85rem;
    }

    /* Views */
    .view-section{ display:none; padding:16px; animation:fadeIn .25s ease; }
    .view-section.active{ display:block; }
    @keyframes fadeIn{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:translateY(0);} }

    /* Landing (Categories) */
    .section-title{
      display:flex; align-items:center; justify-content:space-between;
      margin:6px 0 14px 0;
    }
    .section-title h3{ margin:0; font-size:1.05rem; }
    .muted{ color:var(--muted); font-size:.9rem; }

    .categories-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:14px;
    }
    .cat-card{
      background:var(--surface);
      border-radius:var(--radius);
      padding:16px;
      box-shadow:var(--shadow);
      cursor:pointer;
      border:1px solid rgba(0,0,0,.04);
      display:flex; flex-direction:column; gap:10px;
      min-height:120px;
    }
    .cat-card:active{ transform:scale(.985); }
    .cat-top{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
    }
    .cat-icon{
      width:54px; height:54px;
      border-radius:18px;
      background:rgba(39,174,96,.12);
      display:flex; align-items:center; justify-content:center;
      overflow:hidden;
      flex:0 0 auto;
    }
    .cat-icon img{ width:100%; height:100%; object-fit:cover; }
    .cat-name{ font-weight:800; font-size:1rem; line-height:1.2; }
    .cat-sub{ color:var(--muted); font-size:.85rem; }

    /* Products */
    .products-header{
      display:flex; align-items:center; gap:10px;
      margin:4px 0 12px 0;
    }
    .back-btn{
      width:42px; height:42px;
      border-radius:12px;
      border:none;
      background:#e9eef2;
      cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      color:#2c3e50;
    }
    .products-title{
      font-weight:900;
      margin:0;
      font-size:1.05rem;
      flex:1;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .chips{
      display:flex; gap:10px;
      overflow:auto;
      padding:6px 2px 12px 2px;
    }
    .chip{
      background:#fff;
      border:1px solid rgba(0,0,0,.10);
      color:var(--text);
      padding:8px 12px;
      border-radius:999px;
      cursor:pointer;
      white-space:nowrap;
      font-size:.9rem;
    }
    .chip.active{
      background:rgba(39,174,96,.12);
      border-color:rgba(39,174,96,.35);
      color:var(--primary);
      font-weight:800;
    }

    .products-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:12px;
    }
    .product-card{
      background:#fff;
      border-radius:14px;
      overflow:hidden;
      box-shadow:var(--shadow);
      border:1px solid rgba(0,0,0,.04);
      cursor:pointer;
      display:flex;
      flex-direction:column;
    }
    .p-img-container{
      height:140px;
      background:#eef2f5;
      position:relative;
    }
    .p-img{ width:100%; height:100%; object-fit:cover; }
    .pill{
      position:absolute; top:10px; right:10px;
      padding:6px 10px;
      border-radius:999px;
      font-size:.8rem;
      font-weight:800;
      color:#fff;
      box-shadow:0 8px 16px rgba(0,0,0,.12);
    }
    .pill.ok{ background:var(--ok); }
    .pill.out{ background:var(--danger); }

    .p-details{
      padding:10px;
      display:flex; flex-direction:column; gap:6px;
      flex:1;
    }
    .p-name{
      font-weight:900;
      font-size:.92rem;
      line-height:1.25;
      height:38px;
      overflow:hidden;
    }
    .p-row{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      margin-top:auto;
    }
    .p-price{ color:var(--primary); font-weight:900; font-size:1.05rem; }
    .add-mini{
      width:40px; height:40px;
      border-radius:12px;
      border:none;
      background:var(--primary);
      color:#fff;
      font-weight:900;
      cursor:pointer;
    }
    .add-mini:disabled{ opacity:.5; cursor:not-allowed; }
    .pagination{
      display:flex; justify-content:center; align-items:center; gap:14px;
      margin:18px 0 6px 0;
    }
    .page-btn{
      padding:8px 18px;
      background:#fff;
      border:1px solid rgba(0,0,0,.12);
      border-radius:999px;
      cursor:pointer;
    }
    .page-btn:disabled{ opacity:.5; cursor:not-allowed; }

    /* Floating Cart */
    .cart-float{
      position:fixed;
      bottom:18px; right:18px;
      width:64px; height:64px;
      border-radius:22px;
      background:var(--secondary);
      color:#fff;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 14px 26px rgba(0,0,0,.18);
      z-index:400;
      cursor:pointer;
    }
    .cart-float .badge{
      top:-8px; left:-8px;
      border-color:var(--secondary);
    }

    /* Modals */
    .modal-overlay{
      position:fixed; top:0; left:0;
      width:100%; height:100%;
      background:rgba(0,0,0,.55);
      display:none;
      align-items:flex-end;
      z-index:1000;
    }
    .modal-sheet{
      width:100%;
      max-height:88vh;
      background:#fff;
      border-radius:26px 26px 0 0;
      padding:18px;
      overflow:auto;
      animation:slideUp .25s ease;
    }
    @keyframes slideUp{ from{ transform:translateY(100%);} to{ transform:translateY(0);} }

    .detail-img{
      width:100%;
      height:240px;
      object-fit:contain;
      background:#f3f5f7;
      border-radius:16px;
      margin-bottom:12px;
    }
    .qty-control{
      display:flex; align-items:center; gap:12px;
      background:#f6f8fa;
      padding:10px;
      border-radius:14px;
      width:fit-content;
      margin:12px 0;
    }
    .qty-btn{
      width:38px; height:38px;
      border-radius:999px;
      border:1px solid rgba(0,0,0,.12);
      background:#fff;
      cursor:pointer;
      font-weight:900;
      font-size:1.2rem;
    }

    .primary-btn{
      width:100%;
      padding:14px;
      border:none;
      border-radius:16px;
      background:var(--primary);
      color:#fff;
      font-weight:900;
      cursor:pointer;
      margin-top:8px;
    }
    .primary-btn:disabled{ opacity:.5; cursor:not-allowed; }

    /* Cart modal */
    .cart-item{
      display:flex; gap:10px;
      padding:12px 0;
      border-bottom:1px solid rgba(0,0,0,.06);
    }
    .cart-item img{
      width:64px; height:64px;
      border-radius:12px;
      object-fit:cover;
      background:#eef2f5;
      flex:0 0 auto;
    }
    .cart-mid{ flex:1; min-width:0; }
    .cart-name{
      font-weight:900; font-size:.95rem;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .cart-price{ color:var(--primary); font-weight:900; margin-top:2px; }
    .cart-controls{
      display:flex; flex-direction:column; align-items:flex-end; gap:8px;
    }
    .mini-ctrl{
      display:flex; align-items:center; gap:8px;
      background:#f6f8fa;
      border-radius:999px;
      padding:6px 10px;
    }
    .mini-btn{
      width:28px; height:28px;
      border-radius:999px;
      border:1px solid rgba(0,0,0,.10);
      background:#fff;
      cursor:pointer;
      font-weight:900;
    }
    .trash{
      border:none; background:transparent; color:var(--danger);
      cursor:pointer; font-size:1.05rem;
    }

    .checkout-box{
      background:#f6f8fa;
      border-radius:18px;
      padding:14px;
      margin-top:12px;
    }
    .field{
      width:100%;
      padding:12px;
      border:1px solid rgba(0,0,0,.12);
      border-radius:12px;
      margin-top:10px;
      outline:none;
      background:#fff;
    }
    textarea.field{ resize:none; min-height:80px; }

    .checkout-btn{
      width:100%;
      padding:16px;
      border:none;
      border-radius:16px;
      background:#25D366;
      color:#fff;
      font-weight:900;
      font-size:1.05rem;
      cursor:pointer;
      margin-top:12px;
      display:flex; align-items:center; justify-content:center; gap:10px;
    }

    /* Footer */
    footer{
      margin:14px 16px 0 16px;
      background:#fff;
      border-radius:18px;
      padding:14px;
      box-shadow:var(--shadow);
      border:1px solid rgba(0,0,0,.04);
    }
    .footer-row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:space-between;
      align-items:center;
    }
    .social{
      display:flex; gap:10px; flex-wrap:wrap;
    }
    .social a{
      background:#f6f8fa;
      border:1px solid rgba(0,0,0,.08);
      padding:10px 12px;
      border-radius:999px;
      display:inline-flex;
      align-items:center;
      gap:8px;
      font-weight:800;
      color:var(--secondary);
    }

    @media (min-width: 900px){
      .categories-grid, .products-grid{ grid-template-columns:repeat(4,1fr); }
      .p-img-container{ height:170px; }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-row">
      <div class="header-actions">
        <button class="icon-btn" title="الرئيسية" onclick="goHome()">
          <i class="fa-solid fa-house"></i>
        </button>
        <button class="icon-btn" title="السلة" onclick="openCart()">
          <i class="fa-solid fa-cart-shopping"></i>
          <span class="badge" id="headerCartBadge">0</span>
        </button>
      </div>

      <div class="header-title">
        <i class="fa-solid fa-basket-shopping"></i>
        <span>سوبر ماركت إكسبرس</span>
      </div>
    </div>

    <div class="search-wrapper">
      <input id="searchInput" class="search-input" type="text" placeholder="ابحث في كل المنتجات (مثلاً: حليب، سكر...)" />
      <div class="search-hint">البحث يعمل على كل المنتجات ويعرض النتائج مباشرة.</div>
    </div>
  </header>

  <main id="mainContainer">
    <!-- Landing / Category Hub -->
    <section id="categoriesView" class="view-section active">
      <div class="section-title">
        <h3>الأقسام الرئيسية</h3>
        <span class="muted" id="catsMeta"></span>
      </div>

      <div class="categories-grid" id="categoriesGrid">
        <div class="muted">جاري تحميل الأقسام...</div>
      </div>

      <footer>
        <div class="footer-row">
          <div style="font-weight:900;">تواصل سريع</div>
          <div class="social">
            <a href="#" onclick="return false;"><i class="fa-brands fa-whatsapp"></i> واتساب</a>
            <a href="#" onclick="return false;"><i class="fa-solid fa-phone"></i> اتصال</a>
            <a href="#" onclick="return false;"><i class="fa-brands fa-instagram"></i> انستغرام</a>
          </div>
        </div>
        <div class="muted" style="margin-top:10px;">.</div>
      </footer>
    </section>

    <!-- Products view -->
    <section id="productsView" class="view-section">
      <div class="products-header">
        <button class="back-btn" onclick="goHome()" title="رجوع">
          <i class="fa-solid fa-arrow-right"></i>
        </button>
        <h3 class="products-title" id="categoryTitle">اسم القسم</h3>
      </div>

      <div class="chips" id="subCategoryChips" style="display:none;"></div>

      <div class="products-grid" id="productsGrid"></div>
      <div class="pagination" id="paginationControls"></div>
    </section>
  </main>

  <!-- Floating cart -->
  <div class="cart-float" onclick="openCart()" title="السلة">
    <i class="fa-solid fa-cart-shopping" style="font-size:1.4rem;"></i>
    <span class="badge" id="cartBadge">0</span>
  </div>

  <!-- Product modal -->
  <div class="modal-overlay" id="productModal" onclick="if(event.target===this) closeById('productModal')">
    <div class="modal-sheet">
      <img id="mImg" class="detail-img" src="" alt="product" />
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;">
        <div style="flex:1;min-width:0;">
          <h2 id="mName" style="margin:0 0 6px 0;font-size:1.1rem;"></h2>
          <div id="mAvailability" class="muted" style="font-weight:900;"></div>
        </div>
        <div id="mPrice" style="color:var(--primary);font-size:1.3rem;font-weight:900;white-space:nowrap;"></div>
      </div>

      <p id="mDesc" style="color:#4b5563;line-height:1.75;margin:10px 0 0 0;"></p>

      <div class="qty-control">
        <button class="qty-btn" onclick="updateModalQty(-1)">-</button>
        <span id="mQty" style="font-weight:900; width:24px; text-align:center;">1</span>
        <button class="qty-btn" onclick="updateModalQty(1)">+</button>
      </div>

      <button id="mAddBtn" class="primary-btn">أضف للسلة</button>
    </div>
  </div>

  <!-- Cart modal -->
  <div class="modal-overlay" id="cartModal" onclick="if(event.target===this) closeById('cartModal')">
    <div class="modal-sheet">
      <h3 style="margin:0 0 12px 0;">سلة المشتريات</h3>

      <div id="cartItemsContainer" style="min-height:120px;"></div>

      <div class="checkout-box">
        <div style="display:flex;justify-content:space-between;align-items:center;font-weight:900;">
          <span>المجموع الكلي:</span>
          <span id="cartTotal" style="color:var(--primary);">0 ₪</span>
        </div>

        <input class="field" id="cName" type="text" placeholder="الاسم (إجباري)" />
        <input class="field" id="cPhone" type="tel" placeholder="رقم الهاتف (اختياري)" />
        <input class="field" id="cAddress" type="text" placeholder="العنوان بالتفصيل (إجباري)" />
        <textarea class="field" id="cNotes" placeholder="ملاحظات (مثلاً: لا ترن الجرس)"></textarea>

        <button class="checkout-btn" onclick="checkoutWhatsApp()">
          <i class="fa-brands fa-whatsapp"></i> إرسال الطلب عبر واتساب
        </button>
      </div>
    </div>
  </div>

  <script>
    /* =========================
       CONFIG (Your two CSV links)
       ========================= */
    const CATEGORIES_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRBHfoe4ryjWV5V4pTyz8NkgeBOaWDLZRWYcbmF9Ndiq6rmiTcTvPj3Y6Q-pPUzGNdGIww3iitAa_Jm/pub?gid=0&single=true&output=csv";
    const PRODUCTS_URL   = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRBHfoe4ryjWV5V4pTyz8NkgeBOaWDLZRWYcbmF9Ndiq6rmiTcTvPj3Y6Q-pPUzGNdGIww3iitAa_Jm/pub?gid=298667236&single=true&output=csv";

    const WA_NUMBER = "972569541101"; // without +

    /* =========================
       STATE
       ========================= */
    let categories = [];
    let allProducts = [];
    let cart = JSON.parse(localStorage.getItem("myCart")) || [];

    let currentList = [];
    let currentPage = 1;
    const ITEMS_PER_PAGE = 20;

    let modalQty = 1;
    let selectedProduct = null;

    // subcategory filter inside a chosen category
    let currentSub = "ALL";
    let lastViewMode = "HOME"; // HOME | CATEGORY | SEARCH
    let lastCategoryId = null;
    let lastCategoryName = "";

    /* =========================
       INIT
       ========================= */
    Promise.all([loadCSV(CATEGORIES_URL), loadCSV(PRODUCTS_URL)])
      .then(([cats, prods]) => {
        categories = normalizeCategories(cats);
        allProducts = normalizeProducts(prods);

        document.getElementById("catsMeta").innerText = categories.length ? (categories.length + " قسم") : "";
        renderCategories();
        updateCartBadge();
      })
      .catch(() => {
        document.getElementById("categoriesGrid").innerHTML =
          `<div style="grid-column:1/-1;color:#b00020;font-weight:900;">خطأ تحميل البيانات — تأكد من روابط CSV ومن أسماء الأعمدة.</div>`;
      });

    function loadCSV(url){
      return new Promise((resolve, reject) => {
        Papa.parse(url, {
          download: true,
          header: true,
          skipEmptyLines: true,
          complete: (res) => resolve(res.data || []),
          error: reject
        });
      });
    }

    /* =========================
       NORMALIZERS (Sheets -> Objects)
       ========================= */
    function normalizeCategories(rows){
      // Expected headers (recommended):
      // id, name, image, Description, Active, Last Updated
      return (rows || [])
        .map(r => ({
          id: String(r.id || r.ID || "").trim(),
          name: String(r.name || r.Name || "").trim(),
          img: String(r.image || r.Image || r.imageurl || r.ImageURL || "").trim(),
          desc: String(r.Description || r.description || "").trim(),
          active: String(r.Active || r.active || "TRUE").trim().toUpperCase() !== "FALSE"
        }))
        .filter(c => c.id && c.name && c.active);
    }

    function normalizeProducts(rows){
      // Expected headers (recommended):
      // id, name, price, description, image, stock, category_id, sub_category
      return (rows || [])
        .map(r => ({
          id: String(r.id || r.ID || "").trim(),
          name: String(r.name || r.Name || "").trim(),
          price: Number(r.price || r.Price || 0),
          desc: String(r.description || r.Description || "").trim(),
          img: String(r.image || r.Image || r.imageurl || r.ImageURL || "").trim(),
          stock: Number(r.stock || r.Stock || 0),
          category_id: String(r.category_id || r.CategoryID || r.categoryId || r.category || "").trim(),
          sub_category: String(r.sub_category || r.SubCategory || r.subCategory || "").trim()
        }))
        .filter(p => p.id && p.name && p.category_id);
    }

    /* =========================
       LANDING: CATEGORIES
       ========================= */
    function renderCategories(){
      const grid = document.getElementById("categoriesGrid");
      if(!categories.length){
        grid.innerHTML = `<div style="grid-column:1/-1;color:#b00020;font-weight:900;">لا توجد أقسام.</div>`;
        return;
      }

      grid.innerHTML = categories.map(cat => {
        const count = allProducts.filter(p => p.category_id === String(cat.id)).length;
        return `
          <div class="cat-card" onclick="openCategory('${escapeAttr(cat.id)}', '${escapeAttr(cat.name)}')">
            <div class="cat-top">
              <div class="cat-icon">
                ${cat.img ? `<img src="${escapeAttr(cat.img)}" alt="cat">` : `<i class="fa-solid fa-box"></i>`}
              </div>
              <i class="fa-solid fa-angle-left" style="color:#9aa5b1;"></i>
            </div>
            <div class="cat-name">${escapeHtml(cat.name)}</div>
            <div class="cat-sub">${count ? (count + " منتج") : "—"}</div>
          </div>
        `;
      }).join("");
    }

    function goHome(){
      lastViewMode = "HOME";
      lastCategoryId = null;
      lastCategoryName = "";
      currentSub = "ALL";

      document.getElementById("productsView").classList.remove("active");
      document.getElementById("categoriesView").classList.add("active");

      document.getElementById("searchInput").value = "";
      window.scrollTo(0,0);
    }

    /* =========================
       PRODUCTS VIEW (Category)
       ========================= */
    function openCategory(catId, catName){
      lastViewMode = "CATEGORY";
      lastCategoryId = String(catId);
      lastCategoryName = String(catName);
      currentSub = "ALL";

      document.getElementById("categoriesView").classList.remove("active");
      document.getElementById("productsView").classList.add("active");

      document.getElementById("categoryTitle").innerText = catName;

      // initial list for category
      currentList = allProducts.filter(p => p.category_id === String(catId));
      currentPage = 1;

      renderSubCategoryChips();
      renderPagedProducts();
      window.scrollTo(0,0);
    }

    function renderSubCategoryChips(){
      const chips = document.getElementById("subCategoryChips");
      if(lastViewMode !== "CATEGORY"){
        chips.style.display = "none";
        chips.innerHTML = "";
        return;
      }

      const subs = [...new Set(
        allProducts
          .filter(p => p.category_id === lastCategoryId)
          .map(p => (p.sub_category || "").trim())
          .filter(Boolean)
      )];

      if(!subs.length){
        chips.style.display = "none";
        chips.innerHTML = "";
        return;
      }

      chips.style.display = "flex";
      const allChip = `<button class="chip ${currentSub==="ALL"?"active":""}" onclick="setSub('ALL')">الكل</button>`;
      const subChips = subs.map(s =>
        `<button class="chip ${currentSub===s?"active":""}" onclick="setSub('${escapeAttr(s)}')">${escapeHtml(s)}</button>`
      ).join("");

      chips.innerHTML = allChip + subChips;
    }

    function setSub(sub){
      currentSub = sub;
      currentPage = 1;
      renderSubCategoryChips();
      renderPagedProducts();
      window.scrollTo(0,0);
    }

    /* =========================
       SEARCH (GLOBAL)
       ========================= */
    document.getElementById("searchInput").addEventListener("input", (e) => {
      const term = (e.target.value || "").trim().toLowerCase();

      if(!term){
        goHome();
        return;
      }

      lastViewMode = "SEARCH";
      currentSub = "ALL";
      lastCategoryId = null;

      document.getElementById("categoriesView").classList.remove("active");
      document.getElementById("productsView").classList.add("active");
      document.getElementById("categoryTitle").innerText = "نتائج البحث";

      document.getElementById("subCategoryChips").style.display = "none";
      document.getElementById("subCategoryChips").innerHTML = "";

      currentList = allProducts.filter(p => (p.name || "").toLowerCase().includes(term));
      currentPage = 1;
      renderPagedProducts();
      window.scrollTo(0,0);
    });

    /* =========================
       PAGINATION + PRODUCT CARDS
       ========================= */
    function getEffectiveList(){
      if(lastViewMode === "CATEGORY" && currentSub !== "ALL"){
        return currentList.filter(p => (p.sub_category || "").trim() === currentSub);
      }
      return currentList;
    }

    function renderPagedProducts(){
      const grid = document.getElementById("productsGrid");
      const pager = document.getElementById("paginationControls");
      grid.innerHTML = "";

      const list = getEffectiveList();
      const start = (currentPage - 1) * ITEMS_PER_PAGE;
      const pageItems = list.slice(start, start + ITEMS_PER_PAGE);

      if(!pageItems.length){
        grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:#6b7280;font-weight:900;margin-top:10px;">لا توجد منتجات</div>`;
        pager.innerHTML = "";
        return;
      }

      pageItems.forEach(p => {
        const out = p.stock <= 0;
        grid.innerHTML += `
          <div class="product-card" onclick="openProductModal('${escapeAttr(p.id)}')">
            <div class="p-img-container">
              <img class="p-img" src="${escapeAttr(p.img || 'placeholder.jpg')}" alt="product" loading="lazy">
              <div class="pill ${out ? 'out' : 'ok'}">${out ? 'نفذت الكمية' : 'متوفر'}</div>
            </div>
            <div class="p-details">
              <div class="p-name">${escapeHtml(p.name)}</div>
              <div class="p-row">
                <div class="p-price">${formatPrice(p.price)} ₪</div>
                <button class="add-mini" ${out ? "disabled" : ""} title="أضف للسلة"
                  onclick="event.stopPropagation(); quickAdd('${escapeAttr(p.id)}');">+</button>
              </div>
            </div>
          </div>
        `;
      });

      renderPagination(list.length);
    }

    function renderPagination(totalItems){
      const container = document.getElementById("paginationControls");
      const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);

      if(totalPages <= 1){
        container.innerHTML = "";
        return;
      }

      container.innerHTML = `
        <button class="page-btn" onclick="changePage(-1)" ${currentPage===1 ? "disabled" : ""}>السابق</button>
        <span style="font-weight:900;">${currentPage} / ${totalPages}</span>
        <button class="page-btn" onclick="changePage(1)" ${currentPage===totalPages ? "disabled" : ""}>التالي</button>
      `;
    }

    function changePage(delta){
      currentPage += delta;
      renderPagedProducts();
      window.scrollTo(0,0);
    }

    function quickAdd(id){
      const p = allProducts.find(x => String(x.id) === String(id));
      if(!p || p.stock <= 0) return;
      addToCart(p, 1);
      toast("تمت الإضافة للسلة");
    }

    /* =========================
       PRODUCT MODAL
       ========================= */
    function openProductModal(id){
      selectedProduct = allProducts.find(p => String(p.id) === String(id));
      if(!selectedProduct) return;

      const out = selectedProduct.stock <= 0;

      document.getElementById("mImg").src = selectedProduct.img || "placeholder.jpg";
      document.getElementById("mName").innerText = selectedProduct.name || "";
      document.getElementById("mPrice").innerText = (formatPrice(selectedProduct.price) + " ₪");
      document.getElementById("mDesc").innerText = selectedProduct.desc || "لا يوجد وصف متاح";

      document.getElementById("mAvailability").innerText = out ? "نفذت الكمية" : "متوفر";
      document.getElementById("mAvailability").style.color = out ? "var(--danger)" : "var(--ok)";

      modalQty = 1;
      document.getElementById("mQty").innerText = "1";

      const btn = document.getElementById("mAddBtn");
      btn.disabled = out;
      btn.innerText = out ? "غير متوفر" : "أضف للسلة";
      btn.onclick = () => {
        if(out) return;
        addToCart(selectedProduct, modalQty);
        closeById("productModal");
        toast("تمت الإضافة للسلة");
      };

      document.getElementById("productModal").style.display = "flex";
    }

    function updateModalQty(delta){
      if(modalQty + delta >= 1){
        modalQty += delta;
        document.getElementById("mQty").innerText = String(modalQty);
      }
    }

    /* =========================
       CART
       ========================= */
    function addToCart(product, qty){
      const existing = cart.find(i => String(i.id) === String(product.id));
      if(existing) existing.qty += qty;
      else cart.push({ ...product, qty: qty });

      saveCart();
    }

    function saveCart(){
      localStorage.setItem("myCart", JSON.stringify(cart));
      updateCartBadge();
    }

    function updateCartBadge(){
      const count = cart.reduce((sum, i) => sum + (Number(i.qty) || 0), 0);
      document.getElementById("cartBadge").innerText = String(count);
      document.getElementById("headerCartBadge").innerText = String(count);
    }

    function openCart(){
      const container = document.getElementById("cartItemsContainer");
      container.innerHTML = "";

      if(!cart.length){
        container.innerHTML = `<div class="muted" style="text-align:center;padding:12px 0;font-weight:900;">السلة فارغة</div>`;
        document.getElementById("cartTotal").innerText = "0 ₪";
        document.getElementById("cartModal").style.display = "flex";
        return;
      }

      let total = 0;
      cart.forEach((item, idx) => {
        const qty = Number(item.qty) || 0;
        const price = Number(item.price) || 0;
        total += price * qty;

        container.innerHTML += `
          <div class="cart-item">
            <img src="${escapeAttr(item.img || 'placeholder.jpg')}" alt="item">
            <div class="cart-mid">
              <div class="cart-name">${escapeHtml(item.name || "")}</div>
              <div class="cart-price">${formatPrice(price)} ₪</div>
            </div>
            <div class="cart-controls">
              <div class="mini-ctrl">
                <button class="mini-btn" onclick="cartQty(${idx}, -1)">-</button>
                <span style="min-width:20px;text-align:center;font-weight:900;">${qty}</span>
                <button class="mini-btn" onclick="cartQty(${idx}, 1)">+</button>
              </div>
              <button class="trash" onclick="removeFromCart(${idx})" title="حذف"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
        `;
      });

      document.getElementById("cartTotal").innerText = formatPrice(total) + " ₪";
      document.getElementById("cartModal").style.display = "flex";
    }

    function cartQty(index, delta){
      if(!cart[index]) return;
      cart[index].qty = (Number(cart[index].qty) || 0) + delta;
      if(cart[index].qty <= 0) cart.splice(index, 1);
      saveCart();
      openCart();
    }

    function removeFromCart(index){
      cart.splice(index, 1);
      saveCart();
      openCart();
    }

    /* =========================
       CHECKOUT -> WHATSAPP
       ========================= */
    function checkoutWhatsApp(){
      if(!cart.length) return alert("السلة فارغة!");

      const name = (document.getElementById("cName").value || "").trim();
      const phone = (document.getElementById("cPhone").value || "").trim();
      const address = (document.getElementById("cAddress").value || "").trim();
      const notes = (document.getElementById("cNotes").value || "").trim();

      if(!name || !address) return alert("يرجى تعبئة الاسم والعنوان");

      let msg = `*طلب جديد 🛒*\n` +
                `👤 الاسم: ${name}\n` +
                (phone ? `📱 الهاتف: ${phone}\n` : "") +
                `📍 العنوان: ${address}\n` +
                (notes ? `📝 ملاحظات: ${notes}\n` : "") +
                `\n*المنتجات:*\n`;

      let total = 0;
      cart.forEach(item => {
        const itemTotal = (Number(item.price)||0) * (Number(item.qty)||0);
        total += itemTotal;
        msg += `- ${item.name} (عدد ${item.qty}) = ${formatPrice(itemTotal)}₪\n`;
      });

      msg += `\n*💰 المجموع الكلي: ${formatPrice(total)} ₪*`;

      window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`, "_blank");

      // optional: clear cart after sending
      cart = [];
      saveCart();
      closeById("cartModal");
    }

    /* =========================
       UTILS
       ========================= */
    function closeById(id){ document.getElementById(id).style.display = "none"; }

    function escapeHtml(str){
      return String(str || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function escapeAttr(str){ return escapeHtml(str).replaceAll("`","&#096;"); }

    function formatPrice(n){
      const x = Number(n) || 0;
      return (Math.round(x * 100) / 100).toString();
    }

    function toast(text){
      // simple, fast
      try { console.log(text); } catch(e){}
    }
  </script>
</body>
</html>
